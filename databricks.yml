# Databricks Asset Bundle for the Parser Compare app.
#
#   databricks bundle deploy -t dev
#
# `lifecycle.started: true` on the app resource makes deploy also
# push source and start (or restart) the app — no separate
# `databricks bundle run` is required.
#
# All workspace-specific settings (warehouse, Unity Catalog volume path,
# and custom Model Serving endpoints) live in the `variables:` section
# below and can be edited here, overridden per target, or passed on the
# command line (--var="...").
bundle:
  name: parse-document-compare

# ------------------------------------------------------------
# Deployment variables — override per workspace.
# ------------------------------------------------------------
variables:
  warehouse_id:
    description: SQL warehouse that runs ai_parse_document and ai_query.
    default: "<sql warehouse_id>"
  documents_path:
    description: Unity Catalog volume folder holding the PDFs and images to parse (rendered page images are written to a /page_images subdirectory here).
    default: "/Volumes/<catalog>/<schema>/docs"
  custom_endpoint_names:
    description: Comma-separated list of Model Serving endpoints to populate the parser dropdowns.
    default: "ai-parse-document-fmapi"

# Files synced to the workspace alongside this bundle. node_modules is
# rebuilt by the Apps runtime and is never needed in the deployed app.
#
# package-lock.json is excluded explicitly: a lockfile generated on the
# Databricks corporate network pins every entry to
# npm-proxy.cloud.databricks.com, which the Apps builder cannot reach, so
# syncing one makes `npm install` fail during the deploy build. Excluding it
# here means a developer's local lockfile can never reach the app, even
# though .gitignore already keeps it out of the repo.
sync:
  exclude:
    - node_modules
    - package-lock.json
    - .databricks
    - .venv

resources:
  apps:
    parse-document-compare:
      name: parse-document-compare
      description: "Side-by-side comparison of ai_parse_document and Model Serving document parsers"
      # Deploy from the bundle's synced source folder.
      source_code_path: ./
      # Start (or restart) the app as part of `bundle deploy` so a
      # separate `bundle run` is not needed. Requires the direct
      # deployment engine (the CLI default).
      lifecycle:
        started: true
      config:
        command:
          - npm
          - run
          - start:built
        env:
          - name: WAREHOUSE_ID
            value_from: sql-warehouse
          - name: DOCUMENTS_PATH
            value: ${var.documents_path}
          - name: CUSTOM_ENDPOINT_NAMES
            value: ${var.custom_endpoint_names}
          - name: CUSTOM_RENDER_DPI
            value: "200"
      # Bind the SQL warehouse so app.yaml can read its id at runtime via
      # `valueFrom: sql-warehouse`.
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE

# The workspace host is intentionally NOT set here — workspace.host does
# not support variable interpolation. Supply it at deploy time via the
# DATABRICKS_HOST environment variable or `--profile <name>` so the same
# bundle targets any workspace.
targets:
  dev:
    mode: development
    default: true

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
