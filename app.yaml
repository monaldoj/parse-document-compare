# Databricks App manifest.
#
# IMPORTANT: app.yaml is the source of truth for the app's `command` and
# `env`. The bundle's `resources.apps.*.config` block in databricks.yml
# does NOT deploy env vars into the running app — only the resource
# bindings under `resources:` do. So the warehouse id must be wired
# here, via `valueFrom` against the bound `sql-warehouse` resource.
#
# WAREHOUSE_ID is resolved at runtime from the `sql-warehouse` resource
# binding (its id flows from the `warehouse_id` bundle variable through
# databricks.yml). app.yaml itself cannot use `${var.*}` interpolation —
# only databricks.yml can — so the binding is how the id reaches the app.
#
# The values below have no resource to reference, so they are hardcoded.
# CHANGE THESE for a different workspace:
#   DOCUMENTS_PATH       — volume folder holding the PDFs/images to parse
#   IMAGE_OUTPUT_PATH    — volume ai_parse_document renders page images
#                          into. Bounding boxes are reported relative to
#                          these images, so this is what makes the
#                          overlay pixel-exact. The volume must exist.
#   CUSTOM_ENDPOINT_NAME — Florence serving endpoint (one dropdown option).
#   PALIGEMMA_ENDPOINT_NAME — PaliGemma serving endpoint.
#   GEMINI_38_ENDPOINT_NAME — Gemini 3.8 Flash serving endpoint
#                          (ai-parse-document-gemini). Default comparison
#                          is this vs native ai_parse_document. All
#                          custom endpoints share the same ai_query
#                          contract; only the name differs.
#   CUSTOM_RENDER_DPI    — the DPI those endpoints rasterize PDF pages at,
#                          needed to map their boxes onto the page.
# (DATABRICKS_HOST and the M2M OAuth credentials are injected by the
# Apps runtime automatically.)
# `npm run start:built` = `vite build && node server.js`.
#
# The build has to happen here, at startup, because neither the lockfile nor
# the built frontend is committed:
#   • package-lock.json is gitignored + sync-excluded (a lockfile generated on
#     the corp network pins every entry to npm-proxy.cloud.databricks.com,
#     which this builder cannot reach), so Apps resolves packages itself.
#   • dist/ is gitignored, so there is no prebuilt frontend to serve —
#     Express would 404 on every page if we just ran `node server.js`.
# Everything vite needs is therefore a real runtime `dependency` in
# package.json, not a devDependency, so an `--omit=dev` install still builds.
command:
  - npm
  - run
  - start:built
env:
  - name: WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: DOCUMENTS_PATH
    value: /Volumes/justinm_demo/bio_track/unstructured
  - name: IMAGE_OUTPUT_PATH
    value: /Volumes/justinm_demo/parse/page_images
  - name: CUSTOM_ENDPOINT_NAME
    value: florence-2-large-ft-ai-parse-document
  - name: PALIGEMMA_ENDPOINT_NAME
    value: paligemma2-3b-ai-parse-document
  - name: GEMINI_38_ENDPOINT_NAME
    value: ai-parse-document-gemini
  - name: CUSTOM_RENDER_DPI
    value: "200"
