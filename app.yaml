# Databricks App manifest.
#
# All workspace-specific configuration and defaults are defined in
# `databricks.yml` under `variables:` (`warehouse_id`, `documents_path`,
# and `custom_endpoint_names`) and flow into the app's environment below:
#
#   WAREHOUSE_ID          — resolved from the `sql-warehouse` resource
#                           binding in databricks.yml (${var.warehouse_id}).
#   DOCUMENTS_PATH        — volume folder holding the PDFs/images to parse
#                           (${var.documents_path}). Rendered page images
#                           from ai_parse_document are written to
#                           `<DOCUMENTS_PATH>/page_images` in the same volume.
#   CUSTOM_ENDPOINT_NAMES — comma-separated list of Model Serving endpoint
#                           names populating the parser dropdowns alongside
#                           ai_parse_document and No model
#                           (${var.custom_endpoint_names}).
#   CUSTOM_RENDER_DPI     — the DPI the serving endpoints rasterize PDF
#                           pages at, needed to map their boxes onto the page.
# (DATABRICKS_HOST and the M2M OAuth credentials are injected by the
# Apps runtime automatically.)
# `npm run start:built` = `vite build && node server.js`.
command:
  - npm
  - run
  - start:built
env:
  - name: WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: DOCUMENTS_PATH
    value: "${var.documents_path}"
  - name: CUSTOM_ENDPOINT_NAMES
    value: "${var.custom_endpoint_names}"
  - name: CUSTOM_RENDER_DPI
    value: "200"
